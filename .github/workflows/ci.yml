name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      AUTH_SECRET: abcdefghijklmnopqrstuvwxyz012345
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-cron-secret-value
      DATABASE_URL: postgresql://user:pass@localhost:5432/worknest?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/worknest?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm prisma:validate
      - run: pnpm audit --prod
      - run: pnpm build
